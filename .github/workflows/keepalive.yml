name: Keep Hugging Face Awake

on:
  schedule:
    # 毎日 日本時間の朝7時 (UTC 22:00) に自動実行
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動でテスト実行するためのボタン

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Hugging Face
        run: |
          curl -s https://nyanpre-hasu-song-quiz-api.hf.space/api/ping
          echo "Ping sent successfully!"